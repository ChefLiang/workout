// === UTILITIES ===
function calcScore(a){
  if(a.type==='run'&&a.pace>0){
    var ps=Math.max(0,Math.min(100,100-(a.pace-4.0)*12));
    var hs=Math.max(0,Math.min(100,100-(a.hr-120)*0.6));
    return Math.round(ps*0.55+hs*0.45);
  }
  if(a.type==='train'&&a.hr>0){
    var hs2=Math.max(0,Math.min(100,100-(a.hr-120)*0.6));
    return Math.round(hs2*0.8);
  }
  return 0;
}
function fmtPace(p){
  if(!p||p===0)return'--:--';
  var m=Math.floor(p),s=Math.round((p-m)*60);
  if(s===60){m++;s=0;}
  return m+':'+(s<10?'0':'')+s;
}
function fmtTime(min){
  if(!min&&min!==0)return'--:--:--';
  var total=Math.round(min*60);
  var h=Math.floor(total/3600),rm=total%3600,m=Math.floor(rm/60),s=rm%60;
  return h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function parseTime(str){
  if(!str)return 0;var p=str.split(':');
  if(p.length===3)return parseInt(p[0])*60+parseInt(p[1])+parseInt(p[2])/60;
  if(p.length===2)return parseInt(p[0])+parseInt(p[1])/60;
  return parseFloat(str)||0;
}
function parsePace(str){
  if(!str)return 0;var p=str.split(':');
  if(p.length===2)return parseInt(p[0])+parseInt(p[1])/60;
  return parseFloat(str)||0;
}
function readDuration(){
  var h=parseInt(document.getElementById('fH').value)||0;
  var m=parseInt(document.getElementById('fM').value)||0;
  var s=parseInt(document.getElementById('fS').value)||0;
  return h*60+m+s/60;
}
function autoCalcPace(){
  var type=document.getElementById('fType').value;
  if(type==='train')return;
  var dist=parseFloat(document.getElementById('fDist').value)||0;
  var dur=readDuration();
  if(dist>0&&dur>0){
    var pace=dur/dist;
    document.getElementById('fPace').value=fmtPace(pace);
    document.getElementById('fPace').style.color='#d8dae0';
  }else{
    document.getElementById('fPace').value='';
    document.getElementById('fPace').style.color='#a0a3ad';
  }
}
function parseDate(str){
  var p=str.split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
}

// === STATS ===
function calcStats(){
  var fa=filteredActs();
  var runs=fa.filter(function(a){return a.type==='run';});
  var trains=fa.filter(function(a){return a.type==='train';});
  var totalDist=0;runs.forEach(function(r){totalDist+=r.dist;});
  var allRuns=acts.filter(function(a){return a.type==='run';});
  var allDist=0;allRuns.forEach(function(r){allDist+=r.dist;});
  var avgHR=0,avgScore=0;
  if(fa.length){
    var sumH=0;fa.forEach(function(r){sumH+=r.hr;});
    avgHR=Math.round(sumH/fa.filter(function(a){return a.hr>0;}).length);
  }
  if(runs.length){
    avgScore=Math.round(runs.reduce(function(s,r){return s+calcScore(r);},0)/runs.length);
  }
  var recentN=Math.max(1,Math.floor(runs.length/2));
  var recent=runs.slice(-recentN);
  var older=runs.slice(0,runs.length-recentN);
  var recScore=recent.length?Math.round(recent.reduce(function(s,r){return s+calcScore(r);},0)/recent.length):0;
  var oldScore=older.length?Math.round(older.reduce(function(s,r){return s+calcScore(r);},0)/older.length):recScore;
  var bestPace=runs.length?Math.min.apply(null,runs.map(function(r){return r.pace;})):0;
  var bestDist=runs.length?Math.max.apply(null,runs.map(function(r){return r.dist;})):0;
  var bestHR=runs.length?Math.min.apply(null,runs.map(function(r){return r.hr>0?r.hr:Infinity;})):0;
  if(bestHR===Infinity)bestHR=0;
  var now=new Date();
  var curM=now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2);
  var mData=getMonthlyData();
  var curMonthKm=mData[curM]?Math.round(mData[curM].dist*10)/10:0;
  var prevKm=0;var mKeys=Object.keys(mData).sort();
  for(var i=0;i<mKeys.length;i++){
    if(mKeys[i]===curM&&i>0){prevKm=Math.round(mData[mKeys[i-1]].dist*10)/10;}
  }
  var kmDiff=Math.round((curMonthKm-prevKm)*10)/10;
  var kmDiffStr=kmDiff>=0?'<span class="pos-c">+'+kmDiff.toFixed(1)+'</span>':'<span class="neg-c">'+kmDiff.toFixed(1)+'</span>';
  return{totalDist:allDist,avgHR:avgHR,avgScore:avgScore,
    recScore:recScore,oldScore:oldScore,runs:runs.length,trainCount:trains.length,
    bestPace:bestPace,bestDist:bestDist,bestHR:bestHR,
    goalPct:Math.min(100,Math.round(allDist/GOAL*100)),
    curMonthKm:curMonthKm,kmDiffStr:kmDiffStr,curMonthName:monthNames()[now.getMonth()],
    allRuns:allRuns.length};
}
function updStats(){
  var s=calcStats();
  var diff=s.recScore-s.oldScore;

// === PR RECORDS ===
function calcPR(){
  var allRuns=acts.filter(function(a){return a.type==='run';});
  var results=PR_BRACKETS.map(function(b){
    var matched=allRuns.filter(function(r){return r.dist>=b.min&&r.dist<=b.max&&r.pace>0;});
    if(!matched.length)return{name:b.name,pace:0,date:'',hr:0,dist:0};
    matched.sort(function(a,c){return a.pace-c.pace;});
    var best=matched[0];
    return{name:b.name,pace:best.pace,date:best.date,hr:best.hr,dist:best.dist};
  });
  var bestPace=allRuns.length?Math.min.apply(null,allRuns.map(function(r){return r.pace;})):0;
  var bestDist=allRuns.length?Math.max.apply(null,allRuns.map(function(r){return r.dist;})):0;
  var bestHR=allRuns.length?Math.min.apply(null,allRuns.map(function(r){return r.hr>0?r.hr:Infinity;})):0;
  if(bestHR===Infinity)bestHR=0;
  var paceAct=bestPace?allRuns.filter(function(r){return r.pace===bestPace;})[0]:null;
  var distAct=bestDist?allRuns.filter(function(r){return r.dist===bestDist;})[0]:null;
  var hrAct=bestHR?allRuns.filter(function(r){return r.hr===bestHR;})[0]:null;
  return{brackets:results,pace:bestPace,paceDate:paceAct?paceAct.date:'',dist:bestDist,distDate:distAct?distAct.date:'',hr:bestHR,hrDate:hrAct?hrAct.date:''};
}

  });

function navYear(dir){

  years.push(String(thisYear));

function renderHist(){
  buildHistFilters();

  if(histYearFilter!=='all')list=list.filter(function(a){return a.date.slice(0,4)===histYearFilter;});
  var sorted=list.sort(function(a,b){return b.date.localeCompare(a.date);});

    document.getElementById('histList').innerHTML='<div class="empty-state">'+t('noActivitiesFound')+'</div>';
    document.getElementById('histPager').style.display='none';return;
  }
  var totalPages=Math.max(1,Math.ceil(total/histPerPage));
  if(histPage>totalPages)histPage=totalPages;
  var start=(histPage-1)*histPerPage;
  var page=sorted.slice(start,start+histPerPage);
  var allRuns=acts.filter(function(a){return a.type==='run';});
  var bestPace=allRuns.length?Math.min.apply(null,allRuns.map(function(r){return r.pace;})):0;
  var bestDist=allRuns.length?Math.max.apply(null,allRuns.map(function(r){return r.dist;})):0;
  var bestHR=allRuns.length?Math.min.apply(null,allRuns.map(function(r){return r.hr>0?r.hr:Infinity;})):0;
  if(bestHR===Infinity)bestHR=0;

  var html='';

      if(bestDist>0&&Math.abs(a.dist-bestDist)<EPS)pbBadges+=' <span class="pb-badge">&#127942; '+t('dist')+'</span>';
      if(bestHR>0&&a.hr>0&&a.hr===bestHR)pbBadges+=' <span class="hr-pb pb-badge">&#128154; HR</span>';
    }
    if(realIdx===editIdx){
      var edH=Math.floor(a.min/60),edM=a.min%60,edS=Math.round((a.min-Math.floor(a.min))*60);
      html+='<div class="act-row" style="background:rgba(83,74,183,.08);border-radius:4px;padding:6px 8px;flex-wrap:wrap;gap:4px;">';
      html+='<input type="date" id="edDate" class="edit-inp edit-inp-date" value="'+a.date+'">';
      html+='<select id="edType" class="edit-inp edit-inp-w" style="font-size:11px;">';
      html+='<option value="run"'+(a.type==='run'?' selected':'')+'>'+t('run')+'</option>';
      html+='<option value="train"'+(a.type==='train'?' selected':'')+'>'+t('training')+'</option></select>';
      if(a.type==='run'){
        html+='<input type="number" id="edDist" class="edit-inp" step="0.01" value="'+a.dist+'" placeholder="km" style="width:52px;">';

function addA(){
  var d=document.getElementById('fDate').value;
  if(!d){showToast(t('selectDate'));return;}
  var type=document.getElementById('fType').value;
  var dist=parseFloat(document.getElementById('fDist').value)||0;
  var pace=0;
  if(type==='run'){
    var paceRaw=document.getElementById('fPace').value;
    if(paceRaw&&paceRaw!=='auto')pace=parsePace(paceRaw);
    if(!dist){showToast(t('enterDistance'));return;}
  }
  var dur=readDuration();var hr=parseInt(document.getElementById('fHR').value)||0;
  if(!dur&&!dist){showToast(t('enterDurationOrDistance'));return;}
  var runsBefore=acts.filter(function(a){return a.type==='run';});
  var oldBestPace=runsBefore.length?Math.min.apply(null,runsBefore.map(function(r){return r.pace;})):0;
  var oldBestDist=runsBefore.length?Math.max.apply(null,runsBefore.map(function(r){return r.dist;})):0;
  acts.push({date:d,type:type,dist:dist,pace:pace,hr:hr,min:Math.round(dur)});
  acts.sort(function(a,b){return a.date.localeCompare(b.date);});
  var newPb=false;var pbMsg=t('activityAdded');
  if(type==='run'&&pace>0){
    var allRuns=acts.filter(function(a){return a.type==='run';});
    var newBestPace=Math.min.apply(null,allRuns.map(function(r){return r.pace;}));
    if(oldBestPace===0||pace<oldBestPace){newPb=true;pbMsg=t('newPbPace')+fmtPace(pace)+' min/km';}
  }
  if(type==='run'&&dist>0&&dist>oldBestDist){
    if(newPb)pbMsg+=' | '+t('distance')+': '+dist+' km';
    else{pbMsg=t('newPbDistance')+dist+' km';newPb=true;}
  }
  showToast(pbMsg,newPb);
  document.getElementById('fDist').value='';document.getElementById('fPace').value='';
  document.getElementById('fH').value='';document.getElementById('fM').value='';document.getElementById('fS').value='';
  document.getElementById('fHR').value='';document.getElementById('fPace').style.color='#a0a3ad';
  renderAll();
}

function handleImport(e){
  var file=e.target.files[0];
  if(!file)return;
  var name=file.name.toLowerCase();
  var reader=new FileReader();
  reader.onload=function(ev){
    var txt=ev.target.result;
    var imported=[];
    try{
      if(name.endsWith('.gpx'))imported=parseGPX(txt);
      else if(name.endsWith('.tcx'))imported=parseTCX(txt);
      else if(name.endsWith('.csv'))imported=parseCSV(txt);
      else{showToast(t('unsupportedFile'));return;}
    }catch(err){showToast(t('parseError')+err.message);return;}
    if(!imported.length){showToast(t('noActivitiesInFile'));return;}
    var dupes=0;
    imported.forEach(function(a){
      var exists=acts.some(function(e){return e.date===a.date&&e.type===a.type&&Math.abs(e.dist-a.dist)<0.01;});
      if(!exists)acts.push(a);else dupes++;
    });
    acts.sort(function(x,y){return x.date.localeCompare(y.date);});
    var msg=imported.length+' '+t('importSuccess')+(dupes?' ('+dupes+' '+t('dupSkipped')+')':'');
    showToast(msg);renderAll();
  };
  reader.readAsText(file);
  e.target.value='';
}
function parseGPX(txt){
  var parser=new DOMParser();
  var xml=parser.parseFromString(txt,'text/xml');
  var trkpts=xml.querySelectorAll('trkpt');
  if(!trkpts.length)return[];
  var points=[];
  trkpts.forEach(function(pt){
    var time=pt.querySelector('time');
    var hrExt=pt.getElementsByTagNameNS('*','hr')[0];
    var hrExt2=pt.querySelector('extensions hr');
    var hrExt3=pt.querySelector('heartrate');
    var hr=0;
    if(hrExt)hr=parseInt(hrExt.textContent)||0;
    else if(hrExt2)hr=parseInt(hrExt2.textContent)||0;
    else if(hrExt3){
      var hv=hrExt3.querySelector('value');
      if(hv)hr=parseInt(hv.textContent)||0;
    }
    var ele=pt.querySelector('ele');
    points.push({lat:parseFloat(pt.getAttribute('lat')),lon:parseFloat(pt.getAttribute('lon')),
      time:time?time.textContent:'',hr:hr,ele:ele?parseFloat(ele.textContent):0});
  });
  if(!points.length)return[];
  points.sort(function(a,b){return a.time.localeCompare(b.time);});
  var totalDist=0;
  for(var i=1;i<points.length;i++){
    totalDist+=haversine(points[i-1].lat,points[i-1].lon,points[i].lat,points[i].lon);
  }
  totalDist=Math.round(totalDist*100)/100;
  var t0=new Date(points[0].time);
  var t1=new Date(points[points.length-1].time);
  var durMin=(t1-t0)/60000;
  var pace=durMin>0&&totalDist>0?durMin/totalDist:0;
  var avgHR=0,hrCount=0;
  points.forEach(function(p){if(p.hr>0){avgHR+=p.hr;hrCount++;}});
  avgHR=hrCount?Math.round(avgHR/hrCount):0;
  var ds=t0.toISOString().slice(0,10);
  var gpxPoints=points.map(function(p){return{lat:p.lat,lon:p.lon,time:p.time,hr:p.hr,ele:p.ele};});
  return[{date:ds,type:'run',dist:Math.round(totalDist*10)/10,pace:Math.round(pace*100)/100,hr:avgHR,min:Math.round(durMin),gpxPoints:gpxPoints}];
}
function parseTCX(txt){
  var parser=new DOMParser();
  var xml=parser.parseFromString(txt,'text/xml');
  var results=[];
  var activities=xml.querySelectorAll('Activity');
  activities.forEach(function(act){
    var sport=(act.getAttribute('Sport')||'').toLowerCase();
    var type=sport==='running'?'run':'train';
    var id=act.querySelector('Id');
    var dateStr=id?id.textContent.slice(0,10):'';
    var laps=act.querySelectorAll('Lap');
    var totalDist=0,totalSec=0,avgHR=0,hrCount=0;
    laps.forEach(function(lap){
      var d=lap.querySelector('DistanceMeters');
      if(d)totalDist+=parseFloat(d.textContent)/1000;
      var tm=lap.querySelector('TotalTimeSeconds');
      if(tm)totalSec+=parseFloat(tm.textContent);
      var hr=lap.querySelector('AverageHeartRateBpm Value');
      if(hr){avgHR+=parseFloat(hr.textContent);hrCount++;}
    });
    totalDist=Math.round(totalDist*10)/10;
    var durMin=Math.round(totalSec/60);
    if(hrCount)avgHR=Math.round(avgHR/hrCount);
    var pace=totalDist>0&&durMin>0?Math.round((durMin/totalDist)*100)/100:0;
    if(dateStr)results.push({date:dateStr,type:type,dist:totalDist,pace:pace,hr:avgHR,min:durMin});
  });
  return results;
}
function parseCSV(txt){
  var lines=txt.trim().split('\n');
  if(lines.length<2)return[];
  var results=[];
  var start=0;
  if(lines[0].toLowerCase().indexOf('date')!==-1)start=1;
  for(var i=start;i<lines.length;i++){
    var cols=lines[i].split(',');
    if(cols.length<3)continue;
    var date=cols[0].trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))continue;
    var type=cols[1].trim().toLowerCase()==='train'?'train':'run';
    var dist=parseFloat(cols[2])||0;
    var pace=parseFloat(cols[3])||0;
    var hr=parseInt(cols[4])||0;
    var min=parseFloat(cols[5])||0;
    results.push({date:date,type:type,dist:dist,pace:pace,hr:hr,min:Math.round(min)});
  }
  return results;
}
function haversine(lat1,lon1,lat2,lon2){
  var R=6371;
  var dLat=(lat2-lat1)*Math.PI/180;
  var dLon=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function exportHTML(){
